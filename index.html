<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <link rel="stylesheet" href="css/styles.css">
    <title>Mini Project</title>
</head>
<body>

    <div class="container-fluid">
        <h1>JS Mini Projects -- Intro to JS</h1>

        <div class="row">
            <div class="col-6">
                <div class="card text">
                    <div id="blue"class="card-header">
                        Tip Calculator
                      </div>
                         <div class="card-body">
                               <div class="mb-3">
  <label for="formGroupExampleInput" class="form-label">Subtotal ($)</label>
  <input type="text" class="form-control" id="subTotal" placeholder="">
  <!-- id=formGroupExampleInput -->
</div>
<div class="mb-3">
  <label for="formGroupExampleInput2" class="form-label">Tip  % (as decimal)</label>
  <input type="text" class="form-control" id="tipDec" placeholder="(18%)">
  <!-- id=formGroupExampleInput2 -->
</div>
<button type="button" id="tip" class="btn btn-primary">Calculate Tip</button>
 
            </div>
  <div class="card-footer text-body-secondary">
    <p>Tip Amount</p>
    <p>--</p>
    <p>Total Bill</p>
    <p>--</p>
  </div>
</div>
            </div>
            <div class="col-6">
                <div class="card text">
                    <div id="green" class="card-header">
                        Paycheck Calculator
                      </div>
                         <div class="card-body">
                               <div class="mb-3">
  <label for="formGroupExampleInput" class="form-label">Hours Worked</label>
  <input type="text" class="form-control" id="hrsWork" placeholder="">
</div>
<div class="mb-3">
  <label for="formGroupExampleInput2" class="form-label">Hourly Rate ($)</label>
  <input type="text" class="form-control" id="hrRate" placeholder="">
</div>
<button type="button" id="paycheck" class="btn btn-secondary">Calculate Paycheck</button>
 
            </div>
  <div class="card-footer text-body-info">
    <p>Paycheck Amount</p>
    <p>--</p>
  </div>
</div>
            </div>
        </div>


        <div class="row">
            <div class="col-6">
                <div class="card text">
                    <div id="yellur"class="card-header">
                        Grade Calculator
                      </div>
                         <div class="card-body">
                               <div class="mb-3">
  <label for="formGroupExampleInput" class="form-label">Points Earned</label>
  <input type="text" class="form-control" id="pointsEarned" placeholder="">
</div>
<div class="mb-3">
  <label for="formGroupExampleInput2" class="form-label">Total Points</label>
  <input type="text" class="form-control" id="totalPts" placeholder="">
</div>
<button type="button" id="grade"class="btn btn-info">Calculate Grade</button>
 
            </div>
  <div class="card-footer text-body-secondary">
    <p>Final Grade</p>
    <p>--</p>
   
  </div>
</div>
            </div>


            <div class="col-6">
                <div class="card text">
                    <div id="red" class="card-header">
                        Gas Cost Calculator
                      </div>
                         <div class="card-body">
                               <div class="mb-3">
  <label for="formGroupExampleInput" class="form-label">Tank Size (in gallons)</label>
  <input type="text" class="form-control" id="tankSize" placeholder="">
</div>
<div class="mb-3">
  <label for="formGroupExampleInput2" class="form-label">Price per Gallon ($)</label>
  <input type="text" class="form-control" id="priceGal" placeholder="$4.20">
</div>
<button type="button" id="gas" class="btn btn-light">Calculate Gas Cost</button>
 
            </div>
  <div class="card-footer text-body-secondary">
    <p>Cost to Fill Up</p>
    <p>--</p>
    
  </div>
</div>
            </div>
        </div>



    </div>    
 
    

<script src="js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>      
</body>
</html>
